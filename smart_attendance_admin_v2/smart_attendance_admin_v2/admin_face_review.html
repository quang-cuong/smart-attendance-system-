<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Attendance | Duyệt Face ID</title><style>
body{font-family:system-ui,Arial;background:#f2f5fb;color:#172b49;max-width:980px;margin:30px auto;padding:0 16px}section{background:white;border:1px solid #d8e2f0;border-radius:12px;padding:22px;margin:15px 0}button,input{font:inherit;padding:10px;border-radius:7px;margin:4px}button{color:white;background:#235ff3;border:none;cursor:pointer}button.danger{background:#b93535}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e3eaf1;text-align:left}small{color:#64748b}#app{display:none}#msg{white-space:pre-wrap}
</style></head><body><h1>Smart Attendance · Duyệt khuôn mặt</h1><p><small>Chỉ dành cho Admin. Khi duyệt, hãy kiểm tra trực tiếp sinh viên và mã sinh viên. Hệ thống hiện chỉ lưu đặc trưng khuôn mặt, không lưu ảnh để đối chiếu từ xa.</small></p>
<section id="login"><h2>Đăng nhập Admin</h2><input id="username" placeholder="Tài khoản"><input id="password" type="password" placeholder="Mật khẩu"><button id="loginBtn">Đăng nhập</button></section>
<section id="app"><h2>Đăng ký chờ duyệt</h2><button id="refreshBtn">Làm mới</button><table><thead><tr><th>Mã sinh viên</th><th>Họ tên</th><th>Trạng thái</th><th>Thời gian</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></section><section id="msg"></section>
<script>
const base='https://attendance-cloudflare.quangcuongdk1.workers.dev';let token='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,method='GET',body){const r=await fetch(base+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'HTTP '+r.status);return d}
$('loginBtn').onclick=async()=>{try{const d=await req('/api/auth/login','POST',{username:$('username').value,password:$('password').value});if(d.user.role!=='admin')throw Error('Chỉ tài khoản Admin');token=d.token;$('password').value='';$('login').style.display='none';$('app').style.display='block';await refresh()}catch(e){$('msg').textContent=e.message}};
async function refresh(){try{const d=await req('/api/admin/face-registrations');const rows=d.data||[];$('rows').innerHTML=rows.map(r=>`<tr><td>${esc(r.student_code)}</td><td>${esc(r.full_name)}</td><td>${esc(r.status)}</td><td>${esc(r.created_at)}</td><td>${r.status==='pending'?`<button onclick="review(${Number(r.id)},'approve')">Duyệt</button><button class="danger" onclick="review(${Number(r.id)},'reject')">Từ chối</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có đăng ký</td></tr>';$('msg').textContent='Đã tải '+rows.length+' đăng ký.'}catch(e){$('msg').textContent=e.message}}
async function review(id,action){if(!confirm(action==='approve'?'Bạn đã xác minh danh tính sinh viên trực tiếp và đồng ý kích hoạt khuôn mặt này?':'Từ chối đăng ký khuôn mặt này?'))return;try{await req('/api/admin/face-registrations/'+id+'/'+action,'POST');await refresh()}catch(e){$('msg').textContent=e.message}}
$('refreshBtn').onclick=refresh;
</script></body></html>
